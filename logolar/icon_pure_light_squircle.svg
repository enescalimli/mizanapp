<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.4"/>
    </linearGradient>

    
    <linearGradient id="emblemSurface" x1="320" y1="350" x2="500" y2="660" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fbfcfd"/>
      <stop offset="80%" stop-color="#edf1f5"/>
      <stop offset="100%" stop-color="#dbe1e8"/>
    </linearGradient>

    <linearGradient id="rightBaseSurface" x1="565" y1="630" x2="690" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9aa4ae"/>
      <stop offset="20%" stop-color="#b6c0cb"/>
      <stop offset="50%" stop-color="#dbe1e8"/>
      <stop offset="80%" stop-color="#f4f7f9"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="flapSurface" x1="525" y1="520" x2="574" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#edf1f5"/>
    </linearGradient>

    <filter id="emblemFloat" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#475569" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#475569" flood-opacity="0.14"/>
    </filter>

    <filter id="creaseShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="3" dy="1" result="offset"/>
      <feFlood flood-color="#334155" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)" />
  <rect width="1022" height="1022" x="1" y="1" rx="223" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  
  <g transform="translate(-317.44, -311.77) scale(1.62)" filter="url(#emblemFloat)">
    <!-- Left Wing -->
    <path d="M 324 349
             L 444 421
             C 492 449.8 499 500 499 510
             L 499 668
             L 379 596
             C 366 588.2 324 565 324 519
             Z"
          fill="url(#emblemSurface)" />

    <!-- Right Wing Base -->
    <path d="M 700 349
             L 580 421
             C 532 449.8 525 500 525 510
             L 525 668
             L 645 596
             C 658 588.2 700 565 700 519
             Z"
          fill="url(#rightBaseSurface)" />

    <!-- Right Wing Fold Flap -->
    <path d="M 603 407
             C 581 429 574 453 574 475
             L 574 580
             C 574 607 569 641.6 525 668
             L 525 510
             C 525 500 532 449.8 580 421
             Z"
          fill="url(#flapSurface)"
          filter="url(#creaseShadow)" />
  </g>

</svg>