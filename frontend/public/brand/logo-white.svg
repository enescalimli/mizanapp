<svg xmlns="http://www.w3.org/2000/svg" viewBox="292 288.5 440 440" width="100%" height="100%">
  <defs>
    <linearGradient id="darkLeft" x1="320" y1="350" x2="500" y2="660" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="75%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="darkRightBase" x1="565" y1="630" x2="690" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="20%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="80%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="darkFlap" x1="525" y1="520" x2="574" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <filter id="darkCreaseShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="4" dy="1" result="offset"/>
      <feFlood flood-color="#020617" flood-opacity="0.45" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="darkHaloGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.20"/>
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g id="emblem-dark-mode" filter="url(#darkHaloGlow)">
    <path d="M 324 349
             L 444 421
             C 492 449.8 499 500 499 510
             L 499 668
             L 379 596
             C 366 588.2 324 565 324 519
             Z"
          fill="url(#darkLeft)" />

    <path d="M 700 349
             L 580 421
             C 532 449.8 525 500 525 510
             L 525 668
             L 645 596
             C 658 588.2 700 565 700 519
             Z"
          fill="url(#darkRightBase)" />

    <path d="M 603 407
             C 581 429 574 453 574 475
             L 574 580
             C 574 607 569 641.6 525 668
             L 525 510
             C 525 500 532 449.8 580 421
             Z"
          fill="url(#darkFlap)"
          filter="url(#darkCreaseShadow)" />
  </g>
</svg>