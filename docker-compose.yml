services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: katilim_postgres
    restart: always
    environment:
      POSTGRES_DB: katilim_db
      POSTGRES_USER: katilim_user
      POSTGRES_PASSWORD: katilim_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katilim_user -d katilim_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: katilim_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: katilim_backend
    restart: always
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://katilim_user:katilim_password@timescaledb:5432/katilim_db
      DATABASE_URL_SYNC: postgresql://katilim_user:katilim_password@timescaledb:5432/katilim_db
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      PORT: 8000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: katilim_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
